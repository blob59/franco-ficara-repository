<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c37"><title>Franco QR Studio — Foto dal computer</title>
<style>html,body{height:100%;margin:0}body{background:#101c37;color:white;font-family:system-ui,'Segoe UI',sans-serif;display:grid;place-items:center}main{text-align:center;max-width:470px;padding:30px}h1{margin:.4em 0;font-size:32px}p{color:#c0d0e9;line-height:1.7}a{color:#9cdbff}.spin{width:38px;height:38px;margin:0 auto 18px;border:4px solid #ffffff44;border-top-color:#8ca9fc;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head>
<body><main role="status" aria-live="polite"><div class="spin" aria-hidden="true"></div><h1>Franco QR Studio</h1><p id="message">Apertura del laboratorio QR…</p><p><a href="/Franco_QR_Studio_1_1.zip">Scarica Franco QR Studio 1.1 completo (ZIP)</a></p></main>
<script>
(async()=>{
 const required=['index.html','style.css','app.js','qr-engine.js','favicon.svg'],d=new TextDecoder('utf-8',{fatal:true});
 function issue(reason){throw new Error(reason)}
 try{
  if(!('DecompressionStream' in window))issue('Browser non compatibile con il formato compresso');
  const response=await fetch('/Franco_QR_Studio_1_1.zip',{cache:'no-cache'});
  if(!response.ok)issue('Archivio non trovato: HTTP '+response.status);
  const data=new Uint8Array(await response.arrayBuffer());
  if(data.length>1024*1024)issue('Archivio troppo grande');
  const view=new DataView(data.buffer),result={};let pos=0;
  while(pos+30<=data.length&&view.getUint32(pos,true)===0x04034b50){
    const flags=view.getUint16(pos+6,true),method=view.getUint16(pos+8,true);
    const compressed=view.getUint32(pos+18,true),uncompressed=view.getUint32(pos+22,true);
    const nlen=view.getUint16(pos+26,true),extra=view.getUint16(pos+28,true);
    if(flags&0x08)issue('Archivio ZIP non supportato');
    const name=d.decode(data.slice(pos+30,pos+30+nlen)),offset=pos+30+nlen+extra;
    if(offset+compressed>data.length)issue('Archivio incompleto');
    if(required.includes(name)){
      const content=data.slice(offset,offset+compressed);let decoded;
      if(method===0)decoded=content;
      else if(method===8){const stream=new Blob([content]).stream().pipeThrough(new DecompressionStream('deflate-raw'));decoded=new Uint8Array(await new Response(stream).arrayBuffer());}
      else issue('Metodo di compressione non supportato');
      if(decoded.length!==uncompressed)issue('File incompleto: '+name);
      result[name]=d.decode(decoded);
    }
    pos=offset+compressed;
  }
  for(const n of required)if(!(n in result))issue('Manca il file '+n);
  let html=result['index.html'];
  html=html.replace(/<link\s+rel="icon"\s+href="favicon\.svg"\s+type="image\/svg\+xml">/i,'<link rel="icon" href="data:image/svg+xml,'+encodeURIComponent(result['favicon.svg'])+'" type="image/svg+xml">');
  html=html.replace(/<link\s+rel="stylesheet"\s+href="style\.css">/i,'<style>'+result['style.css']+'</style>');
  html=html.replace(/<script\s+src="qr-engine\.js"\s+defer><\/script>/i,'<script>'+result['qr-engine.js']+'<\/script>');
  html=html.replace(/<script\s+src="app\.js"\s+defer><\/script>/i,'<script>'+result['app.js']+'<\/script>');
  if(html.includes('src="qr-engine.js"')||html.includes('src="app.js"'))issue('Impossibile avviare gli script');
  html=html.replace('<span class="topbar-brand">','<a class="ff-back" href="/" title="Torna al catalogo dei programmi">← Tutti i progetti</a><span class="topbar-brand">');
  html=html.replace('</head>','<style>.ff-back{display:inline-flex;align-items:center;margin-right:14px;padding:9px 13px;background:#ffffff15;border:1px solid #8090ba55;border-radius:9px;font:700 12px system-ui,sans-serif;color:inherit;text-decoration:none;white-space:nowrap}.ff-back:hover{background:#5474cd35}@media(max-width:600px){.ff-back{font-size:11px;padding:7px 9px;margin-right:8px}}</style></head>');
  // Il ZIP 1.1 include photo-local.js: il browser lo carica una sola volta.
  document.open();document.write(html);document.close();
 }catch(e){const m=document.getElementById('message');if(m)m.textContent='Non riesco ad avviare il programma: '+(e?.message||'errore sconosciuto')+'. Puoi comunque scaricare il file ZIP.';console.error('Avvio Franco QR Studio:',e);}
})();
</script></body></html>
